{% extends "layouts/base_admin.html" %}

{% block title %}Delete Taxonomy | Admin Panel{% endblock %}
{% block admin_header_title %}Confirm Taxonomy Deletion{% endblock %}

{% block content %}
<div class="max-w-md mx-auto py-8">
    <div class="bg-white border border-rose-200 rounded-2xl p-6 shadow-lg space-y-4">
        <div class="w-12 h-12 rounded-xl bg-rose-100 border border-rose-200 text-rose-600 flex items-center justify-center text-xl mx-auto">
            <i class="fa-solid fa-triangle-exclamation"></i>
        </div>

        <div class="text-center space-y-1">
            <h3 class="text-lg font-bold text-slate-800">Delete Taxonomy Item</h3>
            <p class="text-xs text-slate-500">Are you sure you want to delete taxonomy item <strong class="text-slate-800">{{ item.name }}</strong>?</p>
        </div>

        <form method="post" class="space-y-4 pt-2">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="flex items-center justify-between gap-3 pt-2 border-t border-slate-100">
                <button type="submit" class="w-full py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-semibold text-xs rounded-xl shadow cursor-pointer transition-all">
                    Confirm Delete
                </button>
                <a href="{{ url_for('admin.taxonomy_index') }}" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 text-slate-700 font-semibold text-xs rounded-xl text-center transition-colors">
                    Cancel
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}

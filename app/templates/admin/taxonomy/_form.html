<form method="post" enctype="multipart/form-data">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="mb-4">
        <label for="name" class="block text-sm font-semibold text-slate-700 mb-1">Name</label>
        <input type="text" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" id="name" name="name" value="{{ item.name if item else '' }}" required>
    </div>
    <div class="mb-4">
        <label for="type" class="block text-sm font-semibold text-slate-700 mb-1">Type</label>
        <input type="text" class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" id="type" name="type" value="{{ item.type if item else '' }}" required>
    </div>
    <div class="mb-6">
        <label for="description" class="block text-sm font-semibold text-slate-700 mb-1">Description</label>
        <textarea class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none text-sm" id="description" name="description" rows="3">{{ item.description if item else '' }}</textarea>
    </div>
    <div class="flex justify-between items-center border-t pt-4">
        <button type="submit" class="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded-lg text-sm transition-colors cursor-pointer">{{ submit_label|default('Save Taxonomy') }}</button>
        <a href="{{ url_for('admin.taxonomy_index') }}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg text-sm transition-colors">Cancel</a>
    </div>
</form>

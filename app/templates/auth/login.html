{% extends "layouts/base_explorer.html" %}

{% block title %}Login | Cambodia Explorer{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-6 py-12">
    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-indigo-600/20 border border-indigo-500/30 text-indigo-400 mb-2">
                <i class="fa-solid fa-user-lock text-xl"></i>
            </div>
            <h2 class="font-heading text-2xl font-extrabold text-white">Welcome Back</h2>
            <p class="text-xs text-slate-400">Sign in to access your account & management panel</p>
        </div>

        <form method="post" action="{{ url_for('auth.login') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
                <div class="relative">
                    <i class="fa-solid fa-user absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                    <input type="text" id="username" name="username" required placeholder="Enter username" class="w-full pl-9 pr-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all" />
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <div class="relative">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                    <input type="password" id="password" name="password" required placeholder="Enter password" class="w-full pl-9 pr-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all" />
                </div>
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:opacity-95 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">
                Sign In
            </button>
        </form>

        <div class="text-center pt-4 border-t border-slate-800 text-xs text-slate-400">
            Don't have an account?
            <a href="{{ url_for('auth.register') }}" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors ml-1">Create Account</a>
        </div>
    </div>
</div>
{% endblock %}

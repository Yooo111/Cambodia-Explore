{% extends "layouts/base_explorer.html" %}

{% block title %}Sign Up | Cambodia Explorer{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-6 py-12">
    <div class="max-w-md w-full bg-slate-900/90 border border-slate-800 rounded-3xl p-8 shadow-2xl backdrop-blur-xl space-y-6">
        <div class="text-center space-y-2">
            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-cyan-600/20 border border-cyan-500/30 text-cyan-400 mb-2">
                <i class="fa-solid fa-user-plus text-xl"></i>
            </div>
            <h2 class="font-heading text-2xl font-extrabold text-white">Create Account</h2>
            <p class="text-xs text-slate-400">Join Cambodia Explorer for personalized recommendations</p>
        </div>

        <form method="post" action="{{ url_for('auth.register') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div>
                <label for="username" class="block text-xs font-semibold text-slate-300 mb-1.5">Username</label>
                <input type="text" id="username" name="username" value="{{ username or '' }}" required placeholder="Choose a username" class="w-full px-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all" />
            </div>

            <div>
                <label for="email" class="block text-xs font-semibold text-slate-300 mb-1.5">Email Address</label>
                <input type="email" id="email" name="email" value="{{ email or '' }}" required placeholder="name@example.com" class="w-full px-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all" />
            </div>

            <div>
                <label for="full_name" class="block text-xs font-semibold text-slate-300 mb-1.5">Full Name</label>
                <input type="text" id="full_name" name="full_name" value="{{ full_name or '' }}" required placeholder="Your full name" class="w-full px-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all" />
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 mb-1.5">Password</label>
                <input type="password" id="password" name="password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all" />
            </div>

            <div>
                <label for="confirm_password" class="block text-xs font-semibold text-slate-300 mb-1.5">Confirm Password</label>
                <input type="password" id="confirm_password" name="confirm_password" required placeholder="••••••••" class="w-full px-4 py-2.5 bg-slate-950/80 border border-slate-800 rounded-xl text-sm text-white placeholder-slate-600 focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 outline-none transition-all" />
            </div>

            <button type="submit" class="w-full py-3 bg-gradient-to-r from-indigo-600 to-cyan-600 hover:opacity-95 text-white font-bold text-sm rounded-xl shadow-lg shadow-indigo-600/30 transition-all cursor-pointer">
                Create Account
            </button>
        </form>

        <div class="text-center pt-4 border-t border-slate-800 text-xs text-slate-400">
            Already registered?
            <a href="{{ url_for('auth.login') }}" class="font-semibold text-indigo-400 hover:text-indigo-300 transition-colors ml-1">Sign In</a>
        </div>
    </div>
</div>
{% endblock %}
